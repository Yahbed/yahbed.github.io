<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDRAM — Producción</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#e85d00;--navy:#1a1a2e;--bg:#0f0f1a;--card:#1a1a2e;
  --border:rgba(255,255,255,0.08);--gray:#6b7280;
  --green:#16a34a;--red:#dc2626;
  --m1:#f59e0b;--m2:#0d9488;--m3:#3b82f6;--m4:#ec4899;--m5:#8b5cf6;
  --m1b:rgba(245,158,11,.15);--m2b:rgba(13,148,136,.15);
  --m3b:rgba(59,130,246,.15);--m4b:rgba(236,72,153,.15);--m5b:rgba(139,92,246,.15);
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#e5e7eb;min-height:100vh}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px}
.login-logo{display:flex;align-items:center;justify-content:center;gap:.75rem;margin-bottom:1.5rem}
.login-logo-circle{width:46px;height:46px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
.login-brand{font-size:1.4rem;font-weight:800;color:#fff}
.login-subtitle{text-align:center;font-size:.83rem;color:var(--gray);margin-bottom:2rem}
.login-field{margin-bottom:1rem}
.login-field label{display:block;font-size:.78rem;color:#9ca3af;margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.login-field input{width:100%;background:#0f0f1a;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px 14px;color:#fff;font-size:.9rem;outline:none;transition:border-color .2s}
.login-field input:focus{border-color:var(--orange)}
#login-error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:8px;padding:10px 14px;font-size:.83rem;margin-bottom:1rem;display:none}
.btn-login{width:100%;background:var(--orange);color:#fff;border:none;border-radius:8px;padding:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn-login:hover{opacity:.9}
.btn-login:disabled{opacity:.5;cursor:not-allowed}

/* ── TOP BAR ── */
#dashboard{display:none;min-height:100vh}
.top-bar{background:var(--navy);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.top-bar-left{display:flex;align-items:center;gap:1rem}
.top-bar-logo{width:34px;height:34px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.top-bar-title{font-size:.95rem;font-weight:700;color:#fff}
.top-bar-badge{background:rgba(232,93,0,.15);color:var(--orange);border:1px solid rgba(232,93,0,.3);border-radius:20px;font-size:.72rem;padding:2px 10px;font-weight:600}
.top-bar-right{display:flex;align-items:center;gap:.75rem}
.user-label{font-size:.78rem;color:var(--gray)}
.btn-sm{background:rgba(255,255,255,.06);border:1px solid var(--border);color:#d1d5db;border-radius:7px;padding:6px 14px;font-size:.78rem;cursor:pointer;transition:background .2s}
.btn-sm:hover{background:rgba(255,255,255,.12)}
.btn-logout{background:none;border:1px solid rgba(255,255,255,.1);color:var(--gray);border-radius:7px;padding:6px 12px;font-size:.78rem;cursor:pointer}
.btn-logout:hover{border-color:rgba(239,68,68,.4);color:#fca5a5}

/* ── MAIN ── */
.main{padding:1.5rem;max-width:1400px;margin:0 auto}
.refresh-bar{font-size:.74rem;color:var(--gray);text-align:right;margin-bottom:1.25rem}
#refresh-countdown{color:var(--orange);font-weight:600}

/* Stats */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.5rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.9rem 1.1rem}
.stat-lbl{font-size:.7rem;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.stat-val{font-size:1.55rem;font-weight:800;color:#fff}
.stat-sub{font-size:.7rem;color:var(--gray);margin-top:2px}

/* ── MACHINE PANELS ── */
.machines-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:16px}

.machine-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}

.mpanel-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.mpanel-title{display:flex;align-items:center;gap:10px}
.mpanel-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.mpanel-name{font-size:1rem;font-weight:800;color:#fff}
.mpanel-count{font-size:.72rem;color:var(--gray);background:rgba(255,255,255,.06);padding:2px 9px;border-radius:20px}

.mpanel-body{flex:1;overflow-y:auto;max-height:480px}
.mpanel-empty{padding:2rem 1rem;text-align:center;color:var(--gray);font-size:.83rem}

/* ── ORDER ITEM ── */
.order-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;position:relative}
.order-item:last-child{border-bottom:none}
.order-item:hover{background:rgba(255,255,255,.04)}

.oi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px}
.oi-id{font-size:.93rem;font-weight:800;color:#fff}
.oi-product{font-size:.75rem;color:#9ca3af;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.oi-badges{display:flex;gap:6px;flex-shrink:0}

.badge{font-size:.67rem;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-proceso{background:rgba(232,93,0,.15);color:#fb923c;border:1px solid rgba(232,93,0,.3)}
.badge-cola{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.badge-vencido{background:rgba(220,38,38,.15);color:#f87171;border:1px solid rgba(220,38,38,.3)}

/* Time progress */
.time-prog{margin-bottom:8px}
.time-prog-labels{display:flex;justify-content:space-between;font-size:.67rem;color:var(--gray);margin-bottom:3px}
.time-prog-track{height:8px;background:rgba(255,255,255,.07);border-radius:6px;overflow:visible;position:relative}
.time-prog-fill{height:100%;border-radius:6px;transition:width .5s ease;position:relative}
.time-prog-marker{position:absolute;right:-1px;top:-3px;width:3px;height:14px;border-radius:2px;background:#fff;opacity:.7}
.time-prog-info{display:flex;justify-content:space-between;font-size:.67rem;color:var(--gray);margin-top:3px}
.time-prog-info .day-count{color:#cbd5e1;font-weight:600}

/* Pieces progress */
.pieces-prog{margin-top:6px}
.pieces-prog-row{display:flex;align-items:center;gap:8px}
.pieces-prog-track{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.pieces-prog-fill{height:100%;border-radius:4px;transition:width .5s ease}
.pieces-prog-label{font-size:.68rem;color:var(--gray);white-space:nowrap}
.pieces-pct{font-size:.72rem;font-weight:700;white-space:nowrap;min-width:32px;text-align:right}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.modal-box{background:#1a1a2e;border:1px solid rgba(255,255,255,.12);border-radius:20px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;animation:popIn .2s ease}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

.modal-header{padding:20px 22px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0;background:#1a1a2e;z-index:1}
.modal-id{font-size:1.25rem;font-weight:800;color:#fff}
.modal-sub{font-size:.78rem;color:var(--gray);margin-top:3px}
.modal-close{background:rgba(255,255,255,.08);border:none;color:#9ca3af;border-radius:8px;width:32px;height:32px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.modal-close:hover{background:rgba(255,255,255,.15);color:#fff}

.modal-body{padding:20px 22px}
.modal-section{margin-bottom:20px}
.modal-section-title{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--gray);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.modal-section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* Info grid */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.info-cell{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px}
.info-cell-lbl{font-size:.67rem;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.info-cell-val{font-size:.88rem;font-weight:600;color:#e5e7eb}

/* Timeline in modal */
.modal-timeline{background:rgba(255,255,255,.04);border-radius:12px;padding:14px}
.mt-track-wrap{position:relative;margin:10px 0 6px}
.mt-track{height:10px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
.mt-fill{height:100%;border-radius:6px;transition:width .6s ease}
.mt-today-line{position:absolute;top:-4px;height:18px;width:2px;border-radius:2px;background:#fff;transform:translateX(-50%);box-shadow:0 0 6px rgba(255,255,255,.5)}
.mt-dates{display:flex;justify-content:space-between;font-size:.7rem;color:var(--gray)}
.mt-today-lbl{text-align:center;font-size:.7rem;color:#cbd5e1;font-weight:600;margin-top:4px}

/* Pieces modal */
.pieces-big{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.pieces-big-val{font-size:2rem;font-weight:800}
.pieces-big-total{font-size:1rem;color:var(--gray)}
.pieces-bar-track{height:12px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;margin-bottom:6px}
.pieces-bar-fill{height:100%;border-radius:8px}

/* Workers table */
.workers-table{width:100%;border-collapse:collapse}
.workers-table th{font-size:.67rem;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
.workers-table td{font-size:.82rem;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:#d1d5db}
.workers-table tr:last-child td{border-bottom:none}
.workers-table tr:hover td{background:rgba(255,255,255,.03)}
.wt-pct-bar{display:inline-block;height:4px;border-radius:2px;vertical-align:middle;margin-left:6px}

/* Loading */
.loading-state{text-align:center;padding:4rem 1rem;color:var(--gray)}
.spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .machines-grid{grid-template-columns:1fr}
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .top-bar-title{display:none}
}
</style>
</head>

<script>
// ══════════════════════════════════════
// USERS

const USERS = {
  "diego@indram.net":         "9e34c31df1032dc4b4b7a8d2505fd74b0456f32bb57e12befd2d129588491e9f",

  "vanefrias2111@gmail.com":  "9cc89455298d97f1cf1c2868d1b3ad4d543756ac8d3a50196f469cfdacb78d6b",
  "perezcinthia639@gmail.com":"0b1bbc8634c7c9371e0b35c3a762a41f325e9245c2af8ff1b3b73cc82a7f73e7",
  "sercho3121@gmail.com":     "26fbd956b2b459c2dfff453f6d0234fbb68055a1b2c5a49587d3e77089d18f01"
};

// ══════════════════════════════════════
// APPSHEET
// ══════════════════════════════════════
const AS_APP  = 'd911f699-9021-4bf3-a892-6eb81926c6fe';
const AS_KEY  = 'V2-x1VkT-hyljn-EF7IT-qTksN-5CsNG-2bx0W-2rrtI-ciqHH';
const AS_BASE = `https://api.appsheet.com/api/v2/apps/${AS_APP}/tables`;

// ══════════════════════════════════════
// MACHINE CONFIG
// ══════════════════════════════════════
const MACHINES = [
  { num:'1', label:'Máquina 1', color:'var(--m1)', bg:'var(--m1b)' },
  { num:'2', label:'Máquina 2', color:'var(--m2)', bg:'var(--m2b)' },
  { num:'3', label:'Máquina 3', color:'var(--m3)', bg:'var(--m3b)' },
  { num:'4', label:'Máquina 4', color:'var(--m4)', bg:'var(--m4b)' },
  { num:'5', label:'Máquina 5', color:'var(--m5)', bg:'var(--m5b)' },
];
const MAQ_COLOR = {'1':'var(--m1)','2':'var(--m2)','3':'var(--m3)','4':'var(--m4)','5':'var(--m5)'};
const MAQ_HEX   = {'1':'#f59e0b','2':'#0d9488','3':'#3b82f6','4':'#ec4899','5':'#8b5cf6'};

function maqNum(raw) {
  if (!raw) return '?';
  const m = String(raw).trim().match(/(\d+)/);
  return m ? m[1] : String(raw).trim();
}

// ══════════════════════════════════════
// AUTH
// ══════════════════════════════════════
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function doLogin() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass  = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  const btn   = document.getElementById('login-btn');
  errEl.style.display = 'none';
  if (!email || !pass) { showErr('Ingresa tu correo y contraseña.'); return; }
  if (!USERS[email])   { showErr('Correo no autorizado.'); return; }
  btn.disabled = true; btn.textContent = 'Verificando…';
  const hash = await sha256(email + ':' + pass);
  if (hash !== USERS[email]) {
    showErr('Contraseña incorrecta.');
    btn.disabled = false; btn.textContent = 'Entrar al área de producción';
    return;
  }
  sessionStorage.setItem('prod_user', email);
  startDashboard(email);
}
function showErr(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block';
}
function doLogout() {
  sessionStorage.removeItem('prod_user');
  clearInterval(window._cdTimer);
  document.getElementById('dashboard').style.display   = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-email').value = '';
  document.getElementById('login-pass').value  = '';
}
document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
window.addEventListener('DOMContentLoaded', () => {
  const u = sessionStorage.getItem('prod_user');
  if (u && USERS[u]) startDashboard(u);
});

// ══════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════
function startDashboard(email) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('user-label').textContent = email;
  loadData();
  startAutoRefresh();
}
let _cd = 60;
function startAutoRefresh() {
  clearInterval(window._cdTimer);
  _cd = 60;
  window._cdTimer = setInterval(() => {
    _cd--;
    const el = document.getElementById('refresh-countdown');
    if (el) el.textContent = _cd;
    if (_cd <= 0) { _cd = 60; loadData(); }
  }, 1000);
}

// ══════════════════════════════════════
// APPSHEET FETCH
// ══════════════════════════════════════
async function fetchAS(table) {
  const res = await fetch(`${AS_BASE}/${encodeURIComponent(table)}/Action`, {
    method:'POST',
    headers:{'ApplicationAccessKey':AS_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({Action:'Find',Properties:{Locale:'en-US',Timezone:'America/Mexico_City'},Rows:[]})
  });
  return res.json();
}

// ══════════════════════════════════════
// DATE HELPERS
// ══════════════════════════════════════
function parseDate(str) {
  if (!str) return null;
  const s = str.trim().split(' ')[0];
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[1]-1, +m[2]);
  const m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m2) return new Date(+m2[1], +m2[2]-1, +m2[3]);
  return null;
}
function parseDateTime(str) {
  if (!str) return null;
  // Try "MM/DD/YYYY HH:MM:SS"
  const m = str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if (m) return new Date(+m[3], +m[1]-1, +m[2], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  return parseDate(str);
}
function fmtDate(d) {
  if (!d) return '—';
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
}
function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

// ══════════════════════════════════════
// GLOBAL STATE
// ══════════════════════════════════════
let _infoMap = {};  // id -> [info rows]
let _allOrders = [];

// ══════════════════════════════════════
// LOAD DATA
// ══════════════════════════════════════
async function loadData() {
  document.getElementById('refresh-countdown').textContent = '60';
  _cd = 60;
  try {
    const [ordenes, infos] = await Promise.all([
      fetchAS('orden de produccion'),
      fetchAS('informacion de produccion')
    ]);

    _infoMap = {};
    (infos||[]).forEach(i => {
      const id = i['ID Produccion'];
      if (!_infoMap[id]) _infoMap[id] = [];
      _infoMap[id].push(i);
    });

    _allOrders = (ordenes||[]).filter(o =>
      ['en proceso','en cola'].includes((o['Estado de produccion']||'').toLowerCase())
    );

    const proceso = _allOrders.filter(o => (o['Estado de produccion']||'').toLowerCase()==='en proceso');
    const cola    = _allOrders.filter(o => (o['Estado de produccion']||'').toLowerCase()==='en cola');
    document.getElementById('stat-proceso').textContent = proceso.length;
    document.getElementById('stat-cola').textContent    = cola.length;
    document.getElementById('stat-piezas').textContent  =
      _allOrders.reduce((s,o)=>s+(parseInt(o['Total de Produccion'])||0),0).toLocaleString('es-MX');
    const maqsSet = new Set(_allOrders.map(o=>maqNum(o['Maquina'])).filter(x=>x&&x!=='?'));
    document.getElementById('stat-maquinas').textContent = maqsSet.size;
    document.getElementById('last-updated').textContent =
      new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

    renderMachines();
  } catch(e) {
    document.getElementById('machines-container').innerHTML =
      '<div class="loading-state" style="color:#fca5a5">Error al cargar datos. Intenta actualizar.</div>';
    console.error(e);
  }
}

// ══════════════════════════════════════
// RENDER MACHINE PANELS
// ══════════════════════════════════════
function renderMachines() {
  const now = new Date();

  const html = `<div class="machines-grid">` +
    MACHINES.map(maq => {
      const orders = _allOrders.filter(o => maqNum(o['Maquina']) === maq.num);
      const countLabel = orders.length
        ? `${orders.length} orden${orders.length!==1?'es':''}`
        : 'libre';

      const bodyHTML = orders.length === 0
        ? `<div class="mpanel-empty">Sin órdenes activas</div>`
        : orders.map(o => renderOrderItem(o, maq, now)).join('');

      return `
      <div class="machine-panel" style="border-top:3px solid ${maq.color}">
        <div class="mpanel-header">
          <div class="mpanel-title">
            <span class="mpanel-dot" style="background:${maq.color}"></span>
            <span class="mpanel-name">${maq.label}</span>
          </div>
          <span class="mpanel-count">${countLabel}</span>
        </div>
        <div class="mpanel-body">${bodyHTML}</div>
      </div>`;
    }).join('') + `</div>`;

  document.getElementById('machines-container').innerHTML = html;
}

function renderOrderItem(o, maq, now) {
  const id     = o['ID Produccion'] || '—';
  const estado = (o['Estado de produccion']||'').toLowerCase();
  const items  = _infoMap[id] || [];
  const prods  = [...new Set(items.map(i=>i['Productos']).filter(Boolean))].join(', ') || (o['Descripcion']||'—');

  // Piece progress
  const total  = parseInt(o['Total de Produccion'])||0;
  const avance = parseInt(o['Avance de produccion'])||0;
  const piecesPct = total > 0 ? Math.min(100, Math.round(avance/total*100)) : 0;
  const piecesColor = piecesPct>=100 ? '#22c55e' : MAQ_HEX[maq.num] || '#e85d00';

  // Time progress
  const inicio = parseDate(o['Fecha de inicio']||o['Fecha de Inicio']);
  const fin    = parseDate(o['Fecha de terminacion']||o['Fecha de Terminacion']);
  const pedido = parseDate(o['Fecha de Pedido']);
  const startD = inicio || pedido;
  const endD   = fin;

  let timePct = null, daysTotal = 0, daysElapsed = 0, isOverdue = false;
  if (startD && endD) {
    daysTotal   = Math.max(1, daysBetween(startD, endD));
    daysElapsed = daysBetween(startD, now);
    timePct     = Math.min(100, Math.max(0, Math.round(daysElapsed/daysTotal*100)));
    isOverdue   = now > endD && piecesPct < 100;
  }

  // Status badge
  let badgeCls = estado === 'en proceso' ? 'badge-proceso' : 'badge-cola';
  let badgeTxt = o['Estado de produccion'] || '—';
  if (isOverdue) { badgeCls = 'badge-vencido'; badgeTxt = 'Vencida'; }

  const timeProgHTML = (timePct !== null) ? `
    <div class="time-prog">
      <div class="time-prog-labels">
        <span>${fmtDate(startD)}</span>
        <span style="color:${isOverdue?'#f87171':'#cbd5e1'};font-weight:600">
          ${isOverdue ? 'Venció '+fmtDate(endD) : 'Día '+Math.max(0,daysElapsed)+' de '+daysTotal}
        </span>
        <span>${fmtDate(endD)}</span>
      </div>
      <div class="time-prog-track">
        <div class="time-prog-fill" style="width:${timePct}%;background:${isOverdue?'#dc2626':MAQ_HEX[maq.num]||'#e85d00'}">
          <div class="time-prog-marker"></div>
        </div>
      </div>
    </div>` : `<div style="font-size:.7rem;color:var(--gray);margin-bottom:6px">Sin fechas de producción</div>`;

  return `
  <div class="order-item" onclick="openModal('${id}')">
    <div class="oi-top">
      <div>
        <div class="oi-id">${id}</div>
        <div class="oi-product">${prods}</div>
      </div>
      <div class="oi-badges">
        <span class="badge ${badgeCls}">${badgeTxt}</span>
      </div>
    </div>
    ${timeProgHTML}
    <div class="pieces-prog">
      <div class="pieces-prog-row">
        <div class="pieces-prog-track">
          <div class="pieces-prog-fill" style="width:${piecesPct}%;background:${piecesColor}"></div>
        </div>
        <span class="pieces-pct" style="color:${piecesColor}">${piecesPct}%</span>
        <span class="pieces-prog-label">${avance.toLocaleString('es-MX')} / ${total.toLocaleString('es-MX')} pzas</span>
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════
// MODAL
// ══════════════════════════════════════
function openModal(id) {
  const o = _allOrders.find(x => x['ID Produccion'] === id);
  if (!o) return;
  const items   = _infoMap[id] || [];
  const now     = new Date();
  const mn      = maqNum(o['Maquina']);
  const maqCfg  = MACHINES.find(m=>m.num===mn) || {label:'Máquina '+mn, color:'#9ca3af', bg:'rgba(156,163,175,.15)'};
  const hex     = MAQ_HEX[mn] || '#9ca3af';

  const estado  = (o['Estado de produccion']||'').toLowerCase();
  const badgeCls= estado==='en proceso' ? 'badge-proceso' : 'badge-cola';

  // Dates
  const inicio  = parseDate(o['Fecha de inicio']||o['Fecha de Inicio']);
  const fin     = parseDate(o['Fecha de terminacion']||o['Fecha de Terminacion']);
  const pedido  = parseDate(o['Fecha de Pedido']);
  const startD  = inicio || pedido;
  const endD    = fin;

  // Time progress
  let timePct=0, daysTotal=0, daysElapsed=0, isOverdue=false;
  if (startD && endD) {
    daysTotal   = Math.max(1, daysBetween(startD, endD));
    daysElapsed = daysBetween(startD, now);
    timePct     = Math.min(100, Math.max(0, Math.round(daysElapsed/daysTotal*100)));
    isOverdue   = now > endD;
  }
  const todayPct = startD && endD
    ? Math.min(100, Math.max(0, daysBetween(startD,now)/daysTotal*100)) : null;

  // Piece progress
  const total  = parseInt(o['Total de Produccion'])||0;
  const avance = parseInt(o['Avance de produccion'])||0;
  const piecesPct = total>0 ? Math.min(100,Math.round(avance/total*100)) : 0;
  const piecesColor = piecesPct>=100 ? '#22c55e' : hex;

  // Products list
  const prods = [...new Set(items.map(i=>i['Productos']).filter(Boolean))].join(', ') || '—';

  // Timeline HTML
  const timelineHTML = (startD && endD) ? `
    <div class="modal-timeline">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:.75rem;color:#9ca3af">Tiempo transcurrido</span>
        <span style="font-size:1rem;font-weight:800;color:${isOverdue?'#f87171':hex}">
          ${isOverdue?'Vencida · '+Math.abs(daysElapsed-daysTotal)+' días tarde':timePct+'%'}
        </span>
      </div>
      <div class="mt-track-wrap">
        <div class="mt-track">
          <div class="mt-fill" style="width:${timePct}%;background:${isOverdue?'#dc2626':hex}"></div>
        </div>
        ${todayPct!==null?`<div class="mt-today-line" style="left:${todayPct}%;background:${isOverdue?'#f87171':'#fff'}"></div>`:''}
      </div>
      <div class="mt-dates">
        <span>Inicio: ${fmtDate(startD)}</span>
        <span style="color:${isOverdue?'#f87171':'#cbd5e1'}">Hoy: ${fmtDate(now)}</span>
        <span>Fin: ${fmtDate(endD)}</span>
      </div>
      <div class="mt-today-lbl">Día ${Math.max(0,daysElapsed)} de ${daysTotal} (${daysTotal-Math.max(0,daysElapsed)} días restantes)</div>
    </div>` : `<p style="font-size:.8rem;color:var(--gray)">No hay fechas de producción registradas.</p>`;

  // Workers breakdown
  // Detect worker name field (try common names)
  const workerFieldCandidates = ['Trabajador','Operario','Operador','Nombre','Quien','Empleado','Usuario','Hecho por','By'];
  let workerField = null;
  if (items.length) {
    const keys = Object.keys(items[0]);
    for (const c of workerFieldCandidates) {
      if (keys.some(k => k.toLowerCase().includes(c.toLowerCase()))) {
        workerField = keys.find(k => k.toLowerCase().includes(c.toLowerCase()));
        break;
      }
    }
  }

  // Group by worker if field found, else by product
  let workersHTML = '';
  if (items.length) {
    const maxAv = Math.max(1, ...items.map(i=>parseInt(i['Avance de produccion'])||0));

    if (workerField) {
      // Group by worker
      const byWorker = {};
      items.forEach(i => {
        const w = i[workerField] || 'Sin nombre';
        if (!byWorker[w]) byWorker[w] = { av:0, tot:0, prods:[] };
        byWorker[w].av  += parseInt(i['Avance de produccion'])||0;
        byWorker[w].tot += parseInt(i['Cantidad de Piezas'])||0;
        if (i['Productos']) byWorker[w].prods.push(i['Productos']);
      });
      workersHTML = `<table class="workers-table">
        <thead><tr><th>Trabajador</th><th>Productos</th><th>Producidas</th><th>Meta</th></tr></thead>
        <tbody>${Object.entries(byWorker).map(([w,d])=>{
          const pct = d.tot>0?Math.round(d.av/d.tot*100):0;
          const barW = d.av>0?Math.round(d.av/maxAv*80):0;
          return `<tr>
            <td style="font-weight:600;color:#e5e7eb">${w}</td>
            <td style="color:#9ca3af;font-size:.75rem">${[...new Set(d.prods)].join(', ')||'—'}</td>
            <td>${d.av.toLocaleString('es-MX')}
              <span class="wt-pct-bar" style="width:${barW}px;background:${hex}"></span>
            </td>
            <td style="color:${pct>=100?'#4ade80':'#fbbf24'};font-weight:600">${d.tot.toLocaleString('es-MX')} (${pct}%)</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
    } else {
      // Show by product line
      workersHTML = `<table class="workers-table">
        <thead><tr><th>Producto</th><th>Máquina</th><th>Avance</th><th>Restante</th></tr></thead>
        <tbody>${items.map(i=>{
          const rest = parseInt(i['Restante de Produccion'])||0;
          const av   = parseInt(i['Avance de produccion'])||0;
          const tot  = parseInt(i['Cantidad de Piezas'])||0;
          return `<tr>
            <td>${i['Productos']||'—'}</td>
            <td>${i['Maquina']||'—'}</td>
            <td>${av.toLocaleString('es-MX')} / ${tot.toLocaleString('es-MX')}</td>
            <td class="${rest<=0?'text-green':'text-yellow'}" style="${rest<=0?'color:#4ade80':'color:#fbbf24'};font-weight:600">
              ${rest<=0?'✓ Listo':rest.toLocaleString('es-MX')+' restantes'}
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
    }
  } else {
    workersHTML = '<p style="font-size:.8rem;color:var(--gray)">Sin detalle de fabricación registrado.</p>';
  }

  document.getElementById('modal-box').innerHTML = `
    <div class="modal-header">
      <div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="modal-id">${id}</div>
          <span class="badge ${badgeCls}">${o['Estado de produccion']}</span>
          <span class="badge" style="background:${maqCfg.bg};color:${maqCfg.color};border:1px solid ${maqCfg.color}40">${maqCfg.label}</span>
        </div>
        <div class="modal-sub">${prods}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

      <!-- Info grid -->
      <div class="modal-section">
        <div class="modal-section-title">Datos generales</div>
        <div class="info-grid">
          <div class="info-cell"><div class="info-cell-lbl">Fecha pedido</div><div class="info-cell-val">${fmtDate(pedido)}</div></div>
          <div class="info-cell"><div class="info-cell-lbl">Inicio producción</div><div class="info-cell-val">${fmtDate(inicio)}</div></div>
          <div class="info-cell"><div class="info-cell-lbl">Fecha entrega</div><div class="info-cell-val" style="color:${isOverdue?'#f87171':'inherit'}">${fmtDate(endD)}</div></div>
          <div class="info-cell"><div class="info-cell-lbl">Máquina</div><div class="info-cell-val" style="color:${hex}">${maqCfg.label}</div></div>
          ${o['Definicion de color']?`<div class="info-cell"><div class="info-cell-lbl">Color</div><div class="info-cell-val">${o['Definicion de color']}</div></div>`:''}
          ${o['Cliente']?`<div class="info-cell"><div class="info-cell-lbl">Cliente</div><div class="info-cell-val">${o['Cliente']}</div></div>`:''}
        </div>
      </div>

      <!-- Timeline -->
      <div class="modal-section">
        <div class="modal-section-title">Tiempo de producción</div>
        ${timelineHTML}
      </div>

      <!-- Pieces progress -->
      <div class="modal-section">
        <div class="modal-section-title">Avance de piezas</div>
        <div class="pieces-big">
          <span class="pieces-big-val" style="color:${piecesColor}">${avance.toLocaleString('es-MX')}</span>
          <span class="pieces-big-total">de ${total.toLocaleString('es-MX')} piezas</span>
          <span style="font-size:1.25rem;font-weight:800;color:${piecesColor};margin-left:4px">${piecesPct}%</span>
        </div>
        <div class="pieces-bar-track">
          <div class="pieces-bar-fill" style="width:${piecesPct}%;background:${piecesColor}"></div>
        </div>
        ${total>0?`<div style="font-size:.75rem;color:var(--gray);margin-top:4px">${(total-avance).toLocaleString('es-MX')} piezas restantes</div>`:''}
      </div>

      <!-- Workers -->
      <div class="modal-section">
        <div class="modal-section-title">Detalle de producción</div>
        ${workersHTML}
      </div>

    </div>`;

  document.getElementById('modal-overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.add('hidden');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('modal-overlay').classList.add('hidden');
    document.body.style.overflow = '';
  }
});
</script>
</body>
</html>
